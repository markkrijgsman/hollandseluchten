  <body>
    <header class="topbar"></header>

    <main class="main">
      <div class="hero-head">
        <span class="info-tag" data-nl="Over LuchtZorg" data-en="About LuchtZorg">Over LuchtZorg</span>
        <h1 style="margin-top: 8px;" data-nl="Voor mensen die om hun lucht geven" data-en="For people who care for their air">Voor mensen die om hun lucht geven</h1>
        <p class="hero-sub" data-nl="LuchtZorg maakt fijnstofdata (PM2.5) uit jouw buurt direct begrijpelijk, transparant en bruikbaar — zonder dat je datawetenschapper hoeft te zijn." data-en="LuchtZorg makes neighbourhood particulate matter (PM2.5) data instantly understandable, transparent, and actionable — without requiring data-science expertise."></p>
      </div>

      <div class="info-grid">
        <article class="info-tile">
          <span class="info-tag" data-nl="Persoonlijk & buurt" data-en="Personal & community wellbeing"></span>
          <h3 data-nl="Jouw gezondheid" data-en="Your Health"></h3>
          <p data-nl="Heldere, toegankelijke luchtkwaliteitscontext voor elk adres — zodat bewoners zowel hun persoonlijke blootstelling als de gezondheid in hun buurt beter begrijpen." data-en="Clear, accessible air-quality context for any address — helping residents understand personal exposure and shared neighbourhood health."></p>
        </article>

        <article class="info-tile">
          <span class="info-tag" data-nl="Gezondheid & leefomgeving" data-en="Health & environment"></span>
          <h3 data-nl="Jouw keuzes" data-en="Your Choices"></h3>
          <p data-nl="Praktisch dagelijks perspectief zonder belerende toon: ondersteuning bij bewuste keuzes voor je eigen gezondheid en schonere lucht in je buurt." data-en="Practical everyday perspective without preaching: supporting mindful decisions for your own health and cleaner air in your community."></p>
        </article>

        <article class="info-tile">
          <span class="info-tag" data-nl="Mens + AI + Lokale democratie" data-en="Human + AI + Local democracy"></span>
          <h3 data-nl="Jouw vragen" data-en="Your Questions"></h3>
          <p data-nl="Helpt bewoners en meetgroepen samen met AI scherpere vragen te stellen en een transparante gedeelde feitenbasis te delen met buren en gemeente." data-en="Helping residents and meetgroepen work with AI to ask sharper questions and share a transparent factual basis with neighbours and gemeente."></p>
        </article>
      </div>

      <section class="card">
        <h2 data-nl="Transparant ontwerp: AI vertaalt je vraag, open R-tools doen het rekenwerk" data-en="Transparent Prototype: AI translates your question, open R tools run the analysis"></h2>
        <p data-nl="Algemene AI-chatbots kunnen getallen gissen wanneer je een vraag stelt over leefomgeving of gezondheid. In LuchtZorg rekent het taalmodel niet zelf: het vertaalt je vraag naar deterministische aanroepen op onze open analyse-API, zodat elke stap controleerbaar blijft." data-en="General-purpose chatbots can guess numbers when asked about environment or health. In LuchtZorg, the language model does not do arithmetic itself: it translates your question into deterministic calls on our open analysis API so every step remains inspectable."></p>
        <p data-nl="Elke analyse roept rechtstreeks de open-source R-functies van het RIVM (Samen Analyseren / Analyse-Together) aan voor kalibratiecontrole, uitbijterfiltering (< 100 µg/m³) en sensor-onzekerheid (20%, minimaal 5,3 µg/m³), gecombineerd met 1/d²-afstandsweging (ondergrens 0,5 km) over gekalibreerde Hollandse Luchten-sensoren en officiële Luchtmeetnet-stations." data-en="Every analysis directly executes RIVM’s open-source R functions (Samen Analyseren / Analyse-Together) for calibration checks, outlier filtering (< 100 µg/m³), and sensor uncertainty (20%, min 5.3 µg/m³), combined with 1/d² distance weighting (0.5 km floor) across calibrated Hollandse Luchten sensors and official Luchtmeetnet stations."></p>
        <div class="cta-row">
          <a class="btn-primary" href="/" data-nl="Check mijn plek" data-en="Check my spot">Check mijn plek</a>
          <a class="btn-outline" href="/gesprek/" data-nl="Stel een vraag" data-en="Ask a question">Stel een vraag</a>
          <a class="btn-outline" href="/presentation.html" data-nl="Bekijk presentatie" data-en="View presentation">Bekijk presentatie</a>
        </div>
      </section>

      <section class="card">
        <h2 data-nl="Disclaimer & verantwoord gebruik" data-en="Prototype Disclaimer & Responsible Use"></h2>
        <p data-nl="LuchtZorg is een experimenteel open-source prototype gebouwd tijdens de Hollandse Luchten Hackathon (Challenge 3). Hoewel het systeem gebruikmaakt van gekalibreerde sensordata (pm25_kal), officiële Luchtmeetnet-referentiestations en de R-functies uit Samen Analyseren, blijven burgersensoren gevoelig voor onder meer hoge luchtvochtigheid, lokale plaatsing en tijdelijke uitval." data-en="LuchtZorg is an experimental open-source prototype built during the Hollandse Luchten Hackathon (Challenge 3). While it uses RIVM-calibrated sensor streams (pm25_kal), official Luchtmeetnet reference stations, and Samen Analyseren R functions, low-cost optical citizen sensors remain sensitive to high humidity, local placement, and temporary dropouts."></p>
        <p data-nl="De getoonde waarden, trends en vergelijkingen met WHO-advieswaarden en EU-normen zijn uitsluitend bedoeld voor verkennend buurtinzicht en gesprek — niet als medisch advies of formele wettelijke toetsing." data-en="Displayed values, trends, and comparisons against WHO guidelines and EU limits are intended solely for exploratory community insight and constructive dialogue — not as medical advice or statutory legal compliance testing."></p>
      </section>
    </main>
