  <body>
    <header class="topbar"></header>

    <main class="main">
      <div class="hero-head">
        <span class="info-tag" data-nl="Over LuchtZorg" data-en="About LuchtZorg">Over LuchtZorg</span>
        <h1 style="margin-top: 8px;" data-nl="Voor mensen die om hun lucht geven" data-en="For people who care for their air">Voor mensen die om hun lucht geven</h1>
        <p class="hero-sub" data-nl="LuchtZorg maakt fijnstofdata (PM2.5) uit jouw buurt direct begrijpelijk, transparant en bruikbaar — zonder dat je datawetenschapper hoeft te zijn." data-en="LuchtZorg makes neighbourhood particulate matter (PM2.5) data instantly understandable, transparent, and actionable — without requiring data-science expertise."></p>
      </div>

      <div class="info-grid">
        <article class="info-tile">
          <span class="info-tag" data-nl="Zichtbaar & toegankelijk" data-en="Visible & accessible"></span>
          <h3 data-nl="Jouw gezondheid" data-en="Your Health"></h3>
          <p data-nl="Zie op elk adres in Nederland direct hoe de luchtkwaliteit ervoor staat ten opzichte van de WHO-advieswaarden en EU-normen, inclusief eerlijke meetonzekerheid." data-en="Check any address in the Netherlands against WHO health guidelines and EU legal limits in seconds, with honest measurement uncertainty built in."></p>
        </article>

        <article class="info-tile">
          <span class="info-tag" data-nl="Dagelijkse gewoontes" data-en="Informed daily habits"></span>
          <h3 data-nl="Jouw keuzes" data-en="Your Choices"></h3>
          <p data-nl="Praktische inzichten op jouw voorwaarden: kies een schonere fietsroute, plan buitensporten op betere momenten en krijg grip op je eigen blootstelling." data-en="Actionable insights on your own terms: pick cleaner cycling routes, time outdoor exercise, and take charge of your personal exposure."></p>
        </article>

        <article class="info-tile">
          <span class="info-tag" data-nl="Mens + AI dialoog" data-en="Human + AI dialogue"></span>
          <h3 data-nl="Jouw vragen" data-en="Your Questions"></h3>
          <p data-nl="Stel je vraag in gewone taal. Onze assistent kiest de juiste analysestappen en toont altijd het volledige audit-spoor om met buren of gemeente in gesprek te gaan." data-en="Ask questions in everyday language. Our assistant runs validated analyses and shows the complete audit trail for informed dialogue with neighbours and City Hall."></p>
        </article>
      </div>

      <section class="card">
        <h2 data-nl="Geen gokwerk: AI vertaalt woorden, wetenschap levert de cijfers" data-en="Zero Guesswork: AI translates words, science computes every number"></h2>
        <p data-nl="Veel AI-chatbots verzinnen getallen wanneer je een vraag stelt over milieu of gezondheid. LuchtZorg werkt fundamenteel anders: het taalmodel mag nooit zelf rekenen of schatten. Het vertaalt jouw vraag uitsluitend naar gecontroleerde opdrachten op onze analyse-API." data-en="Generic AI chatbots can hallucinate environmental statistics. LuchtZorg is architected differently: the language model is strictly forbidden from computing or estimating numbers. It only translates your question into deterministic calls on our verified analysis API."></p>
        <p data-nl="Elke berekening roept rechtstreeks de open-source R-functies van het RIVM (Samen Analyseren / Analyse-Together) aan voor kalibratiecontrole, uitbijterfiltering (< 100 µg/m³) en sensor-onzekerheid (20%, minimaal 5,3 µg/m³), gecombineerd met 1/d²-afstandsweging (ondergrens 0,5 km) over gekalibreerde Hollandse Luchten-sensoren en officiële Luchtmeetnet-stations." data-en="Every calculation directly executes RIVM’s open-source R functions (Samen Analyseren / Analyse-Together) for calibration checks, outlier filtering (< 100 µg/m³), and sensor uncertainty (20%, min 5.3 µg/m³), paired with 1/d² distance weighting (0.5 km floor) across calibrated Hollandse Luchten sensors and official Luchtmeetnet stations."></p>
        <div class="cta-row">
          <a class="btn-primary" href="/" data-nl="Check mijn plek" data-en="Check my spot">Check mijn plek</a>
          <a class="btn-outline" href="/gesprek/" data-nl="Stel een vraag" data-en="Ask a question">Stel een vraag</a>
          <a class="btn-outline" href="/presentation.html" data-nl="Bekijk presentatie" data-en="View presentation">Bekijk presentatie</a>
        </div>
      </section>
    </main>
