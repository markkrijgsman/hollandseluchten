<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stel een vraag · Hollandse Luchten (prototype)</title>
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="logo" href="index.html" aria-label="Hollandse Luchten">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-text">Hollandse Luchten</span>
      </a>
      <nav class="topnav">
        <a href="adres.html" id="nav-address">Mijn adres</a>
        <a href="index.html" class="on" id="nav-ask">Stel een vraag</a>
      </nav>
      <div class="top-actions">
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" data-lang="nl" class="on">NL</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <span class="mock-badge" id="badge">Prototype · nepdata</span>
      </div>
    </header>

    <div class="shell">
      <aside class="sidebar">
        <h2 id="side-tools">Luchtkwaliteit</h2>
        <a href="adres.html" id="side-address">Mijn adres</a>
        <a href="index.html" class="on" id="side-ask">Stel een vraag</a>
        <hr />
        <h2 id="side-page">Op deze pagina</h2>
        <a href="#vraag" id="side-question">Je vraag</a>
        <a href="#begrepen" id="side-plan">Zo heb ik het begrepen</a>
        <a href="#antwoord" id="side-answer">Antwoord</a>
        <a href="#audit" id="side-audit">Audit trail</a>
      </aside>

      <main class="main">
        <div class="page-head">
          <div>
            <h1 id="title">Stel je vraag over de luchtkwaliteit</h1>
            <p id="lead" class="lead"></p>
          </div>
        </div>

        <section class="card search" id="vraag">
          <form id="ask" class="ask">
            <input id="q" type="text" autocomplete="off" aria-label="Vraag" />
            <button type="submit" id="submit" class="btn-primary">Analyseer</button>
          </form>
          <div class="examples">
            <span id="try" class="muted small">Probeer:</span>
            <span id="examples" class="chips"></span>
            <button type="button" id="more" class="btn-ghost" aria-expanded="false"></button>
          </div>
        </section>

        <div id="result"></div>
      </main>
    </div>

    <footer id="foot" class="foot muted small"></footer>

    <script src="js/i18n.js"></script>
    <script src="js/real-data.js"></script>
    <script src="js/mock-data.js"></script>
    <script src="js/analysis.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/planner.js"></script>
    <script src="js/intents.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
