<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <title>LuchtZorg — For people who care for their air</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36' fill='none'%3E%3Cpath d='M18 29.5C18 29.5 6 22 6 13.5C6 9.5 9 6.5 13 6.5C15.5 6.5 17.5 7.8 18 9C18.5 7.8 20.5 6.5 23 6.5C27 6.5 30 9.5 30 13.5C30 18 25.5 23.5 21.5 26.5' stroke='%23000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M2 11C6 11 9 13.5 13 13.5C15.5 13.5 17 12 19 12' stroke='%23000' stroke-width='2.1' stroke-linecap='round' stroke-dasharray='1 2'/%3E%3Cpath d='M3 18C8 18 11 20 16 20C19.5 20 22 17.5 26 17.5C28.5 17.5 31 19 33 19' stroke='%23000' stroke-width='2.1' stroke-linecap='round'/%3E%3Cpath d='M7 25C10.5 25 13 23.5 16 24.5C18 25.2 19.5 26.5 22 26.5' stroke='%23000' stroke-width='2.1' stroke-linecap='round' stroke-dasharray='2 2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="/app.css?v=6" />
  </head>
  <body>
    <header class="topbar"></header>

    <main class="main">
      <section class="card search search-compact">
        <div class="search-title-row">
          <h1 id="title" class="search-heading" data-i18n="title">Moet ik me zorgen maken over de lucht hier?</h1>
        </div>
        <search aria-labelledby="title">
          <form id="lookup" class="lookup-bar" action="/" method="GET" novalidate>
            <div class="field field-pc">
              <label for="postcode" data-i18n="form.postcode">Postcode of plaats</label>
              <input
                type="text"
                name="postcode"
                id="postcode"
                autocomplete="postal-code"
                autocorrect="off"
                autocapitalize="characters"
                spellcheck="false"
                enterkeyhint="search"
                placeholder="2011 RD"
                maxlength="40"
                aria-describedby="form-error locate-privacy"
                required
              />
            </div>
            <div class="field field-nr">
              <label for="number" data-i18n="form.number">Huisnr.</label>
              <input
                type="text"
                name="number"
                id="number"
                inputmode="numeric"
                autocorrect="off"
                spellcheck="false"
                enterkeyhint="go"
                placeholder="2"
                maxlength="8"
                aria-describedby="form-error"
              />
            </div>
            <button type="submit" class="btn-primary btn-check" id="go" data-i18n="form.submit">Check</button>
            <button type="button" class="btn-outline btn-locate" id="locate" aria-describedby="locate-privacy">
              <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true" focusable="false">
                <path d="M10 2v2m0 12v2M2 10h2m12 0h2m-8-5a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              </svg>
              <span class="locate-text" data-i18n="form.locate">Mijn locatie</span>
            </button>
          </form>
        </search>

        <p class="form-error" id="form-error" role="alert" aria-live="polite" hidden></p>

        <div class="examples-strip">
          <span class="examples-label muted" data-i18n="form.try">Voorbeeld:</span>
          <button type="button" class="chip chip-sm" data-pc="2011RD" data-nr="2">Grote Markt 2, Haarlem</button>
          <button type="button" class="chip chip-sm" data-pc="1509BT" data-nr="4">Zaanse Schans</button>
          <button type="button" class="chip chip-sm" data-pc="2023CE" data-nr="">Haarlem-Noord</button>
          <button type="button" class="chip chip-sm" data-pc="2034MA" data-nr="">Schalkwijk</button>
          <button type="button" class="chip chip-sm" data-pc="1012JS" data-nr="1">Dam 1, Amsterdam</button>
        </div>

        <p class="muted privacy-micro" id="locate-privacy" data-i18n="form.privacy">
          Je locatie of postcode wordt alleen gebruikt om nabije sensoren te vinden en nooit opgeslagen.
        </p>
      </section>

      <div id="result"></div>
    </main>

    <footer class="foot muted small" id="foot"></footer>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBSotcK_P9raZBxR6EbkJOi7A1FXlvT2UQ"></script>
    <script src="https://unpkg.com/leaflet.gridlayer.googlemutant@0.14.0/dist/Leaflet.GoogleMutant.js"></script>
    <script src="/js/i18n.js?v=6"></script>
    <script src="/js/nav.js?v=6"></script>
    <script src="/js/api.js?v=6"></script>
    <script src="/js/real-data.js?v=6"></script>
    <script src="/js/mock-data.js?v=6"></script>
    <script src="/js/analysis.js?v=6"></script>
    <script src="/js/charts.js?v=6"></script>
    <script src="/js/address.js?v=6"></script>
    <script src="/js/address-page.js?v=6"></script>
  </body>
</html>
