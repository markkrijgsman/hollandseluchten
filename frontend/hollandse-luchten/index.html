  <body>
    <header class="topbar"></header>

    <main class="main">
      <div class="hero-head">
        <span class="info-tag" translate="no">Burgerwetenschap · Citizen Science</span>
        <h1 style="margin-top: 8px;" data-nl="Over Hollandse Luchten" data-en="About Hollandse Luchten">Over Hollandse Luchten</h1>
        <p class="hero-sub" data-nl="Hollandse Luchten is het burgermeetnetwerk van Noord-Holland waarin inwoners, overheden en kennisinstellingen samen de leefomgeving in kaart brengen." data-en="Hollandse Luchten is North Holland’s citizen-science monitoring network where residents, municipalities, and research institutes measure air quality together."></p>
      </div>

      <section class="card">
        <h2 data-nl="Samen meten voor gezonde lucht en beter gesprek" data-en="Measuring together for healthier air and informed dialogue"></h2>
        <p data-nl="In Hollandse Luchten formuleren bewoners hun eigen meetvragen over bijvoorbeeld houtrook, snelwegen, scheepvaart of industrie. Met meer dan 500 open-source sensorkits (waaronder de SODAQ AIR fijnstofmeter) verzamelen zij continu uurlijkse PM2.5-metingen in hun eigen straat en wijk, gekoppeld aan het Samen Meten-dataportaal van het RIVM." data-en="Through Hollandse Luchten, residents formulate their own local research questions around wood burning, highways, shipping, or heavy industry. Using 500+ open-source sensor kits (such as the SODAQ AIR particulate sensor), citizens collect hourly PM2.5 data right on their streets, calibrated and shared via RIVM’s Samen Meten open data portal."></p>
        <p data-nl="Het programma is een initiatief van Provincie Noord-Holland in samenwerking met Waag Futurelab, RIVM, TNO, GGD Amsterdam en Noord-Hollandse gemeenten en omgevingsdiensten." data-en="The programme is initiated by the Province of Noord-Holland in partnership with Waag Futurelab, RIVM, TNO, GGD Amsterdam, and regional municipalities and environmental agencies."></p>
      </section>

      <div class="info-grid">
        <article class="info-tile">
          <span class="info-tag" translate="no">IJmond · Haarlem · Zaanstad · Gooi</span>
          <h3 data-nl="Actieve meetgroepen" data-en="Active Measurement Groups"></h3>
          <p data-nl="Bewoners in IJmond, Haarlem, Zaanstad en Gooi- en Vechtstreek onderzoeken lokale bronnen samen met data-analisten en gezondheidsexperts." data-en="Resident groups in IJmond, Haarlem, Zaanstad, and Gooi- en Vechtstreek investigate local pollution patterns alongside data analysts and public-health experts."></p>
          <a class="ext-link" href="https://hollandse-luchten.org/meetgroepen/" target="_blank" rel="noopener">hollandse-luchten.org/meetgroepen ↗</a>
        </article>

        <article class="info-tile">
          <span class="info-tag" translate="no">SODAQ AIR · PM2.5</span>
          <h3 data-nl="Open hardware & kalibratie" data-en="Open Hardware & Calibration"></h3>
          <p data-nl="De sensorkits meten fijnstof (PM2.5), temperatuur en luchtvochtigheid. Het RIVM kalibreert de ruwe optische metingen met behulp van het officiële Luchtmeetnet." data-en="Citizen sensor kits measure PM2.5, temperature, and relative humidity. RIVM continuously calibrates raw optical readings against official Luchtmeetnet reference stations."></p>
          <a class="ext-link" href="https://hollandse-luchten.org/sensoren/" target="_blank" rel="noopener">hollandse-luchten.org/sensoren ↗</a>
        </article>

        <article class="info-tile">
          <span class="info-tag" translate="no">Zenodo · Open Data</span>
          <h3 data-nl="5 jaar open sensordata" data-en="5 Years of Open Sensor Data"></h3>
          <p data-nl="Meer dan 5,6 miljoen uurlijkse metingen van Hollandse Luchten zijn vrij beschikbaar als open wetenschappelijke dataset en vormen het hart van LuchtZorg." data-en="Over 5.6 million hourly Hollandse Luchten sensor observations are published openly on Zenodo and directly power LuchtZorg’s neighbourhood analyses."></p>
          <a class="ext-link" href="https://zenodo.org/records/23762846" target="_blank" rel="noopener">Zenodo Record 23762846 ↗</a>
        </article>
      </div>

      <section class="card">
        <h2 data-nl="Zelf meedoen met Hollandse Luchten?" data-en="Want to join Hollandse Luchten?"></h2>
        <p data-nl="Bekijk of er een actieve meetgroep in jouw gemeente is, verken de live sensorkaart of lees de onderzoeksrapporten van GGD Amsterdam, TNO en RIVM op de officiële website." data-en="Check whether there is an active measurement group in your municipality, explore the live sensor map, or read validation studies from GGD Amsterdam, TNO, and RIVM on the official website."></p>
        <div class="cta-row">
          <a class="btn-primary" href="https://hollandse-luchten.org/" target="_blank" rel="noopener" data-nl="Bezoek hollandse-luchten.org ↗" data-en="Visit hollandse-luchten.org ↗">Bezoek hollandse-luchten.org ↗</a>
          <a class="btn-outline" href="/tools/" data-nl="Bekijk alle lucht-apps & tools" data-en="Explore all air-quality apps">Bekijk alle lucht-apps & tools</a>
        </div>
      </section>
