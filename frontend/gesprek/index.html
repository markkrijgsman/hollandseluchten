<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <title>Ask a question · LuchtZorg</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36' fill='none'%3E%3Cpath d='M5 13H19.5A3.5 3.5 0 1 0 16 9.5' stroke='%230a0a0a' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M3 18H28.5A3.5 3.5 0 1 0 25 14.5' stroke='%230a0a0a' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M7 23H22A3.5 3.5 0 1 1 18.5 26.5' stroke='%230a0a0a' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/app.css?v=8" />
    <link rel="stylesheet" href="/styles.css?v=8" />
  </head>
  <body>
    <header class="topbar"></header>

    <main class="main chat-main">
      <div class="page-head chat-head">
        <div>
          <h1 id="chat-title">Stel je vraag over de luchtkwaliteit</h1>
          <p id="chat-lead" class="hero-sub"></p>
        </div>
        <button type="button" id="chat-new" class="btn-outline btn-sm" hidden>Nieuw gesprek</button>
      </div>

      <div id="chat-empty" class="chat-empty">
        <p id="example-label" class="muted small">Probeer een van deze vragen:</p>
        <div id="example-chips" class="chips"></div>
      </div>

      <div id="chat-thread" class="chat-thread" aria-live="polite" aria-label="Gesprek"></div>

      <form id="chat-form" class="chat-form-bar">
        <input
          id="chat-input"
          type="text"
          name="message"
          autocomplete="off"
          enterkeyhint="send"
          aria-label="Je vraag"
          placeholder="Typ je vraag hier…"
        />
        <button type="submit" id="chat-submit" class="btn-primary">Verstuur</button>
      </form>
    </main>

    <script src="/js/i18n.js?v=8"></script>
    <script src="/js/nav.js?v=8"></script>
    <script src="/js/api.js?v=8"></script>
    <script src="/js/chat.js?v=8"></script>
  </body>
</html>
