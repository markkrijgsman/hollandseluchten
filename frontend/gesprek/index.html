<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="google" content="notranslate" />
    <title>Ask a question · LuchtZorg</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36' fill='none'%3E%3Cpath d='M18 29.5C18 29.5 6 22 6 13.5C6 9.5 9 6.5 13 6.5C15.5 6.5 17.5 7.8 18 9C18.5 7.8 20.5 6.5 23 6.5C27 6.5 30 9.5 30 13.5C30 18 25.5 23.5 21.5 26.5' stroke='%23000' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M2 11C6 11 9 13.5 13 13.5C15.5 13.5 17 12 19 12' stroke='%23000' stroke-width='2.1' stroke-linecap='round' stroke-dasharray='1 2'/%3E%3Cpath d='M3 18C8 18 11 20 16 20C19.5 20 22 17.5 26 17.5C28.5 17.5 31 19 33 19' stroke='%23000' stroke-width='2.1' stroke-linecap='round'/%3E%3Cpath d='M7 25C10.5 25 13 23.5 16 24.5C18 25.2 19.5 26.5 22 26.5' stroke='%23000' stroke-width='2.1' stroke-linecap='round' stroke-dasharray='2 2'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/app.css?v=6" />
    <link rel="stylesheet" href="/styles.css?v=6" />
  </head>
  <body>
    <header class="topbar"></header>

    <main class="main chat-main">
      <div class="page-head chat-head">
        <div>
          <h1 id="chat-title">Stel je vraag over de luchtkwaliteit</h1>
          <p id="chat-lead" class="hero-sub"></p>
        </div>
        <button type="button" id="chat-new" class="btn-outline btn-sm" hidden>Nieuw gesprek</button>
      </div>

      <div id="chat-empty" class="chat-empty">
        <p id="example-label" class="muted small">Probeer een van deze vragen:</p>
        <div id="example-chips" class="chips"></div>
      </div>

      <div id="chat-thread" class="chat-thread" aria-live="polite" aria-label="Gesprek"></div>

      <form id="chat-form" class="chat-form-bar">
        <input
          id="chat-input"
          type="text"
          name="message"
          autocomplete="off"
          enterkeyhint="send"
          aria-label="Je vraag"
          placeholder="Typ je vraag hier…"
        />
        <button type="submit" id="chat-submit" class="btn-primary">Verstuur</button>
      </form>
    </main>

    <script src="/js/i18n.js?v=6"></script>
    <script src="/js/nav.js?v=6"></script>
    <script src="/js/api.js?v=6"></script>
    <script src="/js/chat.js?v=6"></script>
  </body>
</html>
