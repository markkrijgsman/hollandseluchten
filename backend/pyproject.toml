[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hollandseluchten-backend"
version = "0.1.0"
description = "PM2.5 API for residents, built on the Analyse-Together R functions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "pandas>=2.2,<4",
    "pyarrow>=17",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
chat = ["langchain>=1.0", "langgraph>=1.0", "langchain-openai>=1.0", "langchain-google-genai>=2.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "real_data: needs the HackathonHollandseLuchten data folder (skipped when missing)",
    "live: calls an external service (needs OPENAI_API_KEY)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long strings (prompts, audit text) are fine; the formatter handles code

[tool.ruff.lint.isort]
known-first-party = ["app", "helpers"]
